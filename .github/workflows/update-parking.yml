name: Update Parking

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-parking:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Fetch official parking data
        env:
          PARKING_API_KEY: ${{ secrets.PARKING_API_KEY }}
        run: node scripts/fetch-parking.js
      - name: Commit updated parking data
        run: |
          if git diff --quiet -- data/parking.json; then
            echo "No parking data changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/parking.json
          git commit -m "Update parking data"
          git push
