name: Update Parking

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: beach-data-update
  cancel-in-progress: false

jobs:
  update-parking:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Fetch official parking data
        env:
          PARKING_API_KEY: ${{ secrets.PARKING_API_KEY }}
        run: node scripts/fetch-parking.js
- name: Commit updated parking data
  run: |
    git config user.name "github-actions[bot]"
    git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

    if git diff --quiet -- data/parking.json; then
      echo "No parking changes"
      exit 0
    fi

    git add data/parking.json
    git commit -m "Update parking data"

    git pull --rebase origin main
    git push origin main
